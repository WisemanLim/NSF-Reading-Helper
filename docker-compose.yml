# NSF Reading Helper — Web deployment
#
# Topology:
#   nginx-proxy ──┐
#                 ├─▶ frontend (SPA + /api proxy) ──▶ backend (axum + SQLite)
#   acme ─────────┘
#
# nginx-proxy + acme-companion auto-issue and renew Let's Encrypt certs based
# on the VIRTUAL_HOST / LETSENCRYPT_HOST labels on each app container.

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    container_name: nsf-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-32m}
      DEFAULT_HOST: ${DOMAIN}
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - proxy

  acme:
    image: nginxproxy/acme-companion:2.5
    container_name: nsf-acme
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
      NGINX_PROXY_CONTAINER: nsf-nginx-proxy
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

  # PostgreSQL — production storage. The pg_trgm + fuzzystrmatch extensions
  # are created by the web-server migration on first connect; no manual init
  # script required.
  postgres:
    image: postgres:16-alpine
    container_name: nsf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nsf}
      POSTGRES_USER: ${POSTGRES_USER:-nsf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nsf-change-me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nsf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nsf} -d ${POSTGRES_DB:-nsf}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proxy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: nsf-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Production = Postgres. The web-server reads NSF_DATABASE_URL at startup;
      # postgres:// → tokio-postgres path, sqlite:... or unset → rusqlite.
      NSF_DATABASE_URL: postgres://${POSTGRES_USER:-nsf}:${POSTGRES_PASSWORD:-nsf-change-me}@postgres:5432/${POSTGRES_DB:-nsf}
      NSF_DATA_DIR: /data
      NSF_BIND: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - nsf-data:/data
    networks:
      - proxy
    # No VIRTUAL_HOST — reached only via the frontend nginx.

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web-frontend
    container_name: nsf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - proxy

  # Optional OCR sidecar (pix2tex). Start with: `docker compose --profile ocr up -d`.
  # The frontend nginx proxies /ocr/ to this container when present.
  ocr:
    profiles: ["ocr"]
    build:
      context: .
      dockerfile: Dockerfile.ocr
    container_name: nsf-ocr
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${OCR_LOG_LEVEL:-INFO}
      PRELOAD_MODEL: ${OCR_PRELOAD:-0}
    volumes:
      - nsf-ocr-cache:/data/cache
    networks:
      - proxy

volumes:
  certs:
  vhost:
  html:
  acme:
  nsf-data:
  nsf-ocr-cache:
  nsf-pgdata:

networks:
  proxy:
    name: nsf-proxy
