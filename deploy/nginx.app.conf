# In-container nginx for the frontend. Serves the SPA and reverse-proxies
# /api/ to the backend service. TLS is terminated upstream by the
# nginx-proxy + acme-companion pair.

server {
    listen 80;
    server_name _;

    client_max_body_size 16m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }

    # Optional OCR sidecar. nginx will 502 if the ocr service isn't running —
    # the frontend treats that as a hint to disable the image-upload UI.
    location /ocr/ {
        client_max_body_size 32m;
        proxy_pass http://ocr:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }
}
